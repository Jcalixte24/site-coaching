# Publie le site statique sur GitHub Pages à chaque push sur main (aucune compilation).
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Préparer le site (sans les fichiers de dépôt)
        run: |
          mkdir _site
          cp -r index.html a-propos assets coaching connexion contact entreprises faq mentions-legales paiement \
            manifest.webmanifest robots.txt sitemap.xml .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
